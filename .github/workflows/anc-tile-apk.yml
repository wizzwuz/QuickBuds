name: QuickBuds ANC Tile APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'experimental/**'
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/anc-tile-apk.yml'

permissions:
  contents: write

concurrency:
  group: quickbuds-anc-tile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and package QuickBuds APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Persistent Release Keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p keystore

          if [ ! -f keystore/release.jks ]; then
            echo "Generating persistent QuickBuds release keystore..."
            keytool -genkeypair -v \
              -keystore keystore/release.jks \
              -alias quickbuds \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "quickbuds_keystore_pass" \
              -keypass "quickbuds_keystore_pass" \
              -dname "CN=QuickBuds, OU=Mobile, O=QuickBuds, L=World, ST=Global, C=US"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add keystore/release.jks

            if ! git diff --cached --quiet; then
              git commit -m "chore: persist QuickBuds release signing keystore [skip ci]"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          else
            echo "Persistent release keystore already exists. Reusing it."
          fi

          test -s keystore/release.jks

          # The app's Gradle build reads this file to configure release signing.
          mkdir -p local/keys
          cat > local/keys/keystore.properties <<'PROPERTIES'
          storeFile=keystore/release.jks
          storePassword=quickbuds_keystore_pass
          keyAlias=quickbuds
          keyPassword=quickbuds_keystore_pass
          PROPERTIES

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Build Release and Debug APKs
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:assembleDebug

      - name: Sign Debug APK with the persistent release key
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$DEBUG_APK"

          "$APKSIGNER" sign \
            --ks keystore/release.jks \
            --ks-key-alias quickbuds \
            --ks-pass "pass:quickbuds_keystore_pass" \
            --key-pass "pass:quickbuds_keystore_pass" \
            --out app/build/outputs/apk/debug/app-debug-release-signed.apk \
            "$DEBUG_APK"

          mv app/build/outputs/apk/debug/app-debug-release-signed.apk "$DEBUG_APK"

      - name: Package APKs and verify matching signatures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          version="${version:-unknown}"

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"

          cp "$DEBUG_APK" "out/QuickBuds-${version}-ANC-Tile-debug.apk"
          cp "$RELEASE_APK" "out/QuickBuds-${version}-ANC-Tile-release.apk"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"

          debug_cert="$("$APKSIGNER" verify --print-certs "out/QuickBuds-${version}-ANC-Tile-debug.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          release_cert="$("$APKSIGNER" verify --print-certs "out/QuickBuds-${version}-ANC-Tile-release.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"

          test -n "$debug_cert"
          test -n "$release_cert"
          if [[ "$debug_cert" != "$release_cert" ]]; then
            echo "Debug/release certificate mismatch; refusing to publish APKs as matching-signature builds." >&2
            exit 1
          fi

          printf 'Signing certificate SHA-256: %s\n' "$release_cert" > out/signature-check.txt
          sha256sum out/*.apk > out/SHA256SUMS
          ls -lh out
          cat out/SHA256SUMS

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuickBuds-ANC-Tile-APKs
          path: out/*
          if-no-files-found: error
          retention-days: 14

      - name: Add build summary
        if: success()
        run: |
          {
            echo "### QuickBuds ANC Tile build complete"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Both APKs were signed with the persistent keystore at \`keystore/release.jks\`."
            echo "- Artifact: \`QuickBuds-ANC-Tile-APKs\`"
            echo "- Artifacts expire after 14 days."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build diagnostics if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: QuickBuds-ANC-Tile-build-diagnostics
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 30
