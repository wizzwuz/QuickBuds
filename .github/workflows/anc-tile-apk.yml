name: QuickBuds ANC Tile APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/anc-tile-apk.yml"

permissions:
  contents: read

concurrency:
  group: anc-tile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Name APK
        run: |
          mkdir -p out
          version=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          cp app/build/outputs/apk/debug/app-debug.apk "out/QuickBuds-${version:-debug}-ANC-Tile-debug.apk"
          sha256sum out/*.apk > out/SHA256SUMS

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickBuds-ANC-Tile-APK
          path: out/*
          if-no-files-found: error
          retention-days: 14
