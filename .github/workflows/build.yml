name: Build APK

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          PROPS: ${{ secrets.RELEASE_KEY_PROPERTIES }}
        if: env.KEYSTORE != ''
        run: |
          mkdir -p local/keys
          if printf '%s' "$KEYSTORE" | base64 -di > local/keys/quickbuds-release.jks 2>/dev/null && [ -s local/keys/quickbuds-release.jks ]; then
            printf '%s\n' "$PROPS" > local/keys/keystore.properties
            echo "Release key configured successfully."
          else
            echo "Release key decoding failed or was empty; building unsigned."
            rm -f local/keys/quickbuds-release.jks local/keys/keystore.properties
          fi
      - name: Every string in all locales
        run: python3 scripts/check-locales.py
      - name: Unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug
      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease
      - name: Prepare APK outputs
        run: |
          ver=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          mkdir -p out
          find app/build/outputs/apk/release/ -type f -name "*.apk" -exec cp {} "out/QuickBuds-$ver-release.apk" \;
          find app/build/outputs/apk/debug/ -type f -name "*.apk" -exec cp {} "out/QuickBuds-$ver-debug.apk" \;
          ls -la out/
      - uses: actions/upload-artifact@v4
        with:
          name: QuickBuds-APKs
          path: out/*.apk
          retention-days: 14
