name: Build APK

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing key
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          PROPS: ${{ secrets.RELEASE_KEY_PROPERTIES }}
        run: |
          set -euo pipefail
          mkdir -p keystore local/keys
          python3 - <<'PY'
          import os, sys, base64

          raw_keystore = os.environ.get('KEYSTORE', '').strip()
          raw_props = os.environ.get('PROPS', '').strip()

          configured = False

          # 1. If valid secret exists, use it
          if raw_keystore:
              clean_b64 = ''.join(raw_keystore.split())
              try:
                  keystore_bytes = base64.b64decode(clean_b64)
                  if len(keystore_bytes) > 100:
                      with open('local/keys/quickbuds-release.jks', 'wb') as f:
                          f.write(keystore_bytes)
                      print(f"Decoded secret keystore successfully ({len(keystore_bytes)} bytes)")
                      configured = True
              except Exception as e:
                  print(f"Failed to decode secret KEYSTORE: {e}")

          if configured and raw_props:
              lines = raw_props.splitlines()
              has_store_file = any(line.strip().startswith('storeFile=') for line in lines)
              if not has_store_file:
                  lines.insert(0, 'storeFile=local/keys/quickbuds-release.jks')
              with open('local/keys/keystore.properties', 'w') as f:
                  f.write('\n'.join(lines) + '\n')
              print("Written keystore.properties from secret PROPS")
          # 2. If repo already has a persistent keystore, use it
          elif os.path.exists('keystore/quickbuds-release.jks') and os.path.exists('keystore/keystore.properties'):
              print("Using persistent repository keystore from keystore/...")
              import shutil
              shutil.copy('keystore/quickbuds-release.jks', 'local/keys/quickbuds-release.jks')
              shutil.copy('keystore/keystore.properties', 'local/keys/keystore.properties')
          # 3. Otherwise generate a persistent release keystore and save to keystore/
          else:
              print("Generating persistent release keystore...")
              cmd = (
                  'keytool -genkeypair -v -alias quickbuds -keyalg RSA -keysize 2048 -validity 10000 '
                  '-keystore keystore/quickbuds-release.jks -storepass quickbuds123 -keypass quickbuds123 '
                  '-dname "CN=QuickBuds, OU=QuickBuds, O=QuickBuds, L=Unknown, ST=Unknown, C=US"'
              )
              if os.system(cmd) != 0:
                  sys.exit(1)
              with open('keystore/keystore.properties', 'w') as f:
                  f.write(
                      "storeFile=keystore/quickbuds-release.jks\n"
                      "storePassword=quickbuds123\n"
                      "keyAlias=quickbuds\n"
                      "keyPassword=quickbuds123\n"
                  )
              import shutil
              shutil.copy('keystore/quickbuds-release.jks', 'local/keys/quickbuds-release.jks')
              shutil.copy('keystore/keystore.properties', 'local/keys/keystore.properties')
              print("Generated persistent keystore.")
          PY
          cat local/keys/keystore.properties

          # If keystore was just generated in keystore/, commit it so every build uses the exact same key!
          if git status --porcelain keystore/ | grep -q .; then
            echo "Committing persistent release keystore to repository..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add keystore/quickbuds-release.jks keystore/keystore.properties
            git commit -m "Add persistent release signing key for reproducible signatures [skip ci]" || true
            git push origin HEAD:main || true
          fi

      - name: Every string in all locales
        run: python3 scripts/check-locales.py

      - name: Unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Prepare and verify APK signatures
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"

          STORE_PASS=$(sed -n 's/^[[:space:]]*storePassword[[:space:]]*=[[:space:]]*//p' local/keys/keystore.properties | head -n 1)
          KEY_PASS=$(sed -n 's/^[[:space:]]*keyPassword[[:space:]]*=[[:space:]]*//p' local/keys/keystore.properties | head -n 1)
          KEY_ALIAS=$(sed -n 's/^[[:space:]]*keyAlias[[:space:]]*=[[:space:]]*//p' local/keys/keystore.properties | head -n 1)
          KEY_PASS="${KEY_PASS:-$STORE_PASS}"

          ver=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          mkdir -p out

          # Release APK
          rel_apk=$(find app/build/outputs/apk/release/ -type f -name "*.apk" | head -n 1)
          cp "$rel_apk" "out/QuickBuds-$ver-release.apk"

          # Debug APK
          dbg_apk=$(find app/build/outputs/apk/debug/ -type f -name "*.apk" | head -n 1)
          cp "$dbg_apk" "out/QuickBuds-$ver-debug.apk"

          expected=""
          for apk in out/*.apk; do
            echo "Verifying: $apk"
            # If not verified, sign with apksigner
            if ! "$APKSIGNER" verify "$apk" >/dev/null 2>&1; then
              echo "Signing $apk with release key using apksigner..."
              "$APKSIGNER" sign \
                --ks local/keys/quickbuds-release.jks \
                --ks-key-alias "$KEY_ALIAS" \
                --ks-pass "pass:$STORE_PASS" \
                --key-pass "pass:$KEY_PASS" \
                --v1-signing-enabled true \
                --v2-signing-enabled true \
                --v3-signing-enabled true \
                "$apk"
            fi
            echo "Certificate details for $apk:"
            "$APKSIGNER" verify --verbose --print-certs "$apk"
            fingerprint=$("$APKSIGNER" verify --print-certs "$apk" | grep -m 1 "certificate SHA-256 digest:" | sed -e 's/.*certificate SHA-256 digest:[[:space:]]*//' | tr -d '\r\n ')
            echo "SHA-256 Fingerprint: $fingerprint"
            test -n "$fingerprint"
            if [[ -z "$expected" ]]; then
              expected="$fingerprint"
            elif [[ "$fingerprint" != "$expected" ]]; then
              echo "Error: Signature mismatch! $apk has $fingerprint, expected $expected" >&2
              exit 1
            fi
            printf '%s  %s\n' "$fingerprint" "$(basename "$apk")" >> out/signature-check.txt
          done

          echo "All APKs verified with identical signature:"
          cat out/signature-check.txt
          sha256sum out/*.apk > out/SHA256SUMS
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: QuickBuds-Signed-APKs
          path: out/*
          retention-days: 14
